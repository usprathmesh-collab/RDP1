
name: RDP Ultra Performance

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

    steps:
      - name: Check Secrets
        shell: pwsh
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY2 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { throw "RDP_PASSWORD missing" }
          if ([string]::IsNullOrWhiteSpace($env:TS_KEY)) { throw "TAILSCALE_AUTH_KEY2 missing" }

      - name: Configure RDP
        shell: pwsh
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1
          Set-Service TermService -StartupType Automatic
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          powercfg /setactive SCHEME_MIN
          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0

          $ts = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item -Path $ts -Force | Out-Null
          Set-ItemProperty $ts -Name ColorDepth -Value 3 -Type DWord
          Set-ItemProperty $ts -Name fNoRemoteDesktopWallpaper -Value 1 -Type DWord

          Write-Host "RDP optimized"

      - name: Create RDP User
        shell: pwsh
        run: |
          $pass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          if (Get-LocalUser RDP -ErrorAction SilentlyContinue) {
            Set-LocalUser RDP -Password $pass
          } else {
            New-LocalUser RDP -Password $pass -PasswordNeverExpires | Out-Null
          }

          Add-LocalGroupMember Administrators RDP -ErrorAction SilentlyContinue
          Add-LocalGroupMember "Remote Desktop Users" RDP -ErrorAction SilentlyContinue

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY2 }}
          hostname: gh-rdp-${{ github.run_id }}
          use-cache: 'true'

      - name: Start RDP Monitor
        shell: pwsh
        run: |
          $exe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $exe)) {
            $exe = (Get-Command tailscale -ErrorAction Stop).Source
          }

          $ip = $null
          for ($i = 0; $i -lt 20 -and -not $ip; $i++) {
            $ip = (& $exe ip -4 2>$null | Select-Object -First 1)
            if (-not $ip) { Start-Sleep 3 }
          }

          if (-not $ip) { throw "Tailscale IP unavailable" }

          Write-Host "ADDRESS: $ip"
          Write-Host "USERNAME: RDP"
          Write-Host "PASSWORD: RDP_PASSWORD secret"

          while ($true) {
            Get-Process terminal64,terminal -ErrorAction SilentlyContinue |
              ForEach-Object {
                try { $_.PriorityClass = 'AboveNormal' } catch {}
              }

            Get-Process msedge,chrome -ErrorAction SilentlyContinue |
              ForEach-Object {
                try { $_.PriorityClass = 'Normal' } catch {}
              }

            $os = Get-CimInstance Win32_OperatingSystem
            $cpu = Get-CimInstance Win32_Processor |
              Measure-Object LoadPercentage -Average

            $total = $os.TotalVisibleMemorySize
            $free = $os.FreePhysicalMemory
            $ram = [math]::Round((1 - $free / $total) * 100, 1)

            Write-Host "CPU: $($cpu.Average)% | RAM: $ram%"

            Start-Sleep -Seconds 60
          }
